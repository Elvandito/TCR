name: build-and-install

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package source archive
        run: |
          zip -r GenshinCompressor-source.zip . \
            -x '.git/*' 'app/build/*' 'build/*' '.gradle/*' 'local.properties' \
               'GenshinCompressor-source.zip'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinCompressor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: GenshinCompressor-source
          path: GenshinCompressor-source.zip
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: GenshinCompressor-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb install -r apk/app-debug.apk
            adb shell pm list packages | grep -q '^package:app\.gic$'
            adb shell am start -W -n app.gic/.MainActivity
            sleep 8
            pid="$(adb shell pidof app.gic | tr -d '\r')"
            test -n "$pid"
            adb shell dumpsys activity activities | grep -m1 app.gic
            adb exec-out screencap -p > app-screen.png

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: app-screen.png
          if-no-files-found: ignore
