name: build-and-install

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android 34 SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -n "${SDKMANAGER}" ]; then
            "${SDKMANAGER}" --install "platforms;android-34" "build-tools;34.0.0"
          else
            test -d "${ANDROID_HOME}/platforms/android-34"
            test -d "${ANDROID_HOME}/build-tools/34.0.0"
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package source archive
        run: |
          zip -r GenshinCompressor-source.zip . \
            -x '.git/*' 'app/build/*' 'build/*' '.gradle/*' 'local.properties' \
               'GenshinCompressor-source.zip'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinCompressor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: GenshinCompressor-source
          path: GenshinCompressor-source.zip
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: GenshinCompressor-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set +e
            adb logcat -c
            adb install -r apk/app-debug.apk
            install_rc=$?
            adb shell pm list packages | grep -q '^package:app\.gic$'
            pkg_rc=$?
            adb shell am start -W -n app.gic/.MainActivity
            start_rc=$?
            sleep 10
            adb shell ps -A > ps.txt 2>&1
            adb shell dumpsys activity activities > activity.txt 2>&1
            adb shell dumpsys window windows > windows.txt 2>&1
            adb logcat -d -v threadtime > logcat.txt 2>&1
            adb logcat -d -b crash -v threadtime > crash.txt 2>&1
            adb exec-out screencap -p > app-screen.png 2>&1
            pid="$(adb shell pidof app.gic | tr -d '\r')"
            if [ -z "$pid" ]; then
              pid="$(adb shell ps -A | tr -d '\r' | awk '$9 == "app.gic" { print $2; exit }')"
            fi
            echo "install_rc=$install_rc pkg_rc=$pkg_rc start_rc=$start_rc pid=$pid"
            if [ "$install_rc" -ne 0 ] || [ "$pkg_rc" -ne 0 ] || [ "$start_rc" -ne 0 ] || [ -z "$pid" ]; then
              echo "APP_CHECK_FAILED"
              exit 1
            fi

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: app-screen.png
          if-no-files-found: ignore

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            logcat.txt
            crash.txt
            activity.txt
            windows.txt
            ps.txt
          if-no-files-found: ignore
